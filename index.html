<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Coach</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; max-width: 700px; margin: 0 auto; }
    form { display: grid; gap: 1rem; margin-bottom: 2rem; }
    input, button { padding: 0.75rem; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; }
    button { background: #238636; border: none; font-weight: bold; cursor: pointer; }
    .ai-response { padding: 1rem; border-radius: 6px; margin-top: 1rem; background: #161b22; }
    .hit { border-left: 4px solid #4ecca3; }
    .miss { border-left: 4px solid #f5a623; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td, th { padding: 0.5rem; text-align: left; border-bottom: 1px solid #30363d; }
  </style>
</head>
<body>

  <h2>Browser Coach</h2>
  <form id="coachForm">
    <input type="number" id="inSleep" step="0.1" placeholder="Sleep hours (e.g. 7.5)" required>
    <input type="number" id="inWater" placeholder="Water glasses (e.g. 8)" required>
    <input type="number" id="inSteps" placeholder="Steps count (e.g. 10000)" required>
    <button type="submit">Predict & Get Coaching</button>
  </form>

  <div id="coachDisplay" class="ai-response idle">Submit data to see prediction.</div>

  <h3 style="margin-top: 2rem;">Session History</h3>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Sleep</th>
        <th>Water</th>
        <th>Steps</th>
        <th>Outcome</th>
        <th>Confidence</th>
      </tr>
    </thead>
    <tbody id="historyTable"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
